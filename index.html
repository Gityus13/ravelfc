<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravel FC</title>
<link rel="icon" href="logo.png">
<meta name="description" content="Ravel FC football team, 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="prog" id="prog"></div>
<nav>
  <a class="mark" href="#top"><img class="logo" src="logo.png" alt="" onerror="this.remove()"><span>RAVEL FC</span></a>
  <ul>
    <li><a href="#squad">Squad</a></li>
    <li><a href="#lineup">Lineup</a></li>
    <li><a href="#manager">Manager</a></li>
  </ul>
</nav>

<header class="hero" id="top">
  <div class="glow" id="glow"></div>
  <svg class="swoosh" viewBox="0 0 1440 500" preserveAspectRatio="none" aria-hidden="true">
    <path pathLength="1" d="M-20 470 C 300 470, 520 120, 1460 200"/>
    <path pathLength="1" d="M-20 500 C 360 500, 640 190, 1460 290"/>
    <path pathLength="1" d="M-20 430 C 260 440, 480 70, 1460 120"/>
  </svg>
  <div class="hwrap">
    <div>
      <h1 id="htitle" aria-label="Ravel"></h1>
      <div class="sub"><b>FC</b>Season 2026</div>
    </div>
    <img class="crest" src="logo.png" alt="Ravel FC crest" onerror="this.remove()">
  </div>
  <div class="scroll"></div>
</header>

<div class="ticker" aria-hidden="true"><div id="mq"></div></div>

<section id="squad">
  <div class="head">
    <h2>The squad</h2>
    <p>Seven starters and a sub. Hover for colour, click for the full view.</p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="lineup">
  <div class="head">
    <h2>The lineup</h2>
    <p>Starting seven in a 1-3-1-1. Click a player.</p>
  </div>
  <div class="pitch" id="pitch">
    <svg viewBox="0 0 600 800" aria-label="Starting lineup">
      <g class="lines" fill="none" stroke="rgba(246,243,245,.22)" stroke-width="2">
        <rect pathLength="1" x="30" y="30" width="540" height="740"/><line pathLength="1" x1="30" y1="400" x2="570" y2="400"/><circle pathLength="1" cx="300" cy="400" r="70"/>
        <rect pathLength="1" x="170" y="30" width="260" height="120"/><rect pathLength="1" x="170" y="650" width="260" height="120"/>
        <rect pathLength="1" x="235" y="30" width="130" height="45"/><rect pathLength="1" x="235" y="725" width="130" height="45"/>
      </g>
      <g id="pl"></g>
    </svg>
  </div>
  <div class="bench"><span class="bl">Substitute</span><div id="bench"></div></div>
</section>

<section id="manager">
  <div class="pres">
    <div class="portrait" data-photo="Rasul" data-alt="Manager Rasul"></div>
    <div>
      <h2>Rasul</h2>
      <div class="role">Manager</div>
      <p>Manager of Ravel FC.</p>
    </div>
  </div>
</section>

<footer>
  <span>&copy; <span id="yr"></span> Ravel FC</span>
  <span>Website by <a href="https://gityus13.github.io/"><strong>GITYUS13</strong></a></span>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Player">
  <div class="mbox">
    <div class="mph" id="mph"></div>
    <div class="mtx">
      <div class="mnum" id="mnum"></div>
      <div class="mpos" id="mpos"></div>
      <h3 id="mname"></h3>
      <div class="mnav"><button id="mprev">Previous</button><button id="mnext">Next</button><button id="mclose">Close</button></div>
    </div>
  </div>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>
</body>
</html>
